<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - RideOn</title>
  <meta name="description" content="Sign in to your RideOn account to manage bookings, view rental history, and access exclusive member deals." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{DEFAULT:'#f97316',light:'#fb923c',dark:'#ea580c'},secondary:{DEFAULT:'#0f172a',light:'#1e293b',lighter:'#334155'},accent:{DEFAULT:'#10b981',light:'#34d399',dark:'#059669'},surface:{DEFAULT:'#ffffff',dark:'#151929',darker:'#0c0f1a'}},fontFamily:{heading:['Outfit','sans-serif'],body:['Inter','sans-serif']}}}};</script>
  <link rel="stylesheet" href="assets/css/style.css" /><link rel="stylesheet" href="assets/css/dark-mode.css" /><link rel="stylesheet" href="assets/css/rtl.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    /* Ensure card clears fixed toggle buttons on small screens */
    @media(max-width:640px){
      body.auth-page{ padding-top: 4.5rem; }
    }
    @media(max-width:400px){
      body.auth-page{ padding-top: 3.75rem; }
    }
  </style>
</head>
<body class="auth-page font-body min-h-screen relative flex items-center justify-center p-6 overflow-x-hidden">
  <!-- Auth Toggles (fixed, outside card) -->
  <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50 flex items-center gap-2">
    <button class="btn text-xs font-600 px-3 h-9 rounded-lg bg-slate-800/70 backdrop-blur-md border border-white/20 text-white hover:bg-slate-700/80" data-rtl-toggle aria-label="Toggle RTL">
      <span class="rtl-text">RTL</span>
      <span class="ltr-text" style="display:none;">LTR</span>
    </button>
    <button class="btn btn--icon w-9 h-9 rounded-lg bg-slate-800/70 backdrop-blur-md border border-white/20 text-white hover:bg-slate-700/80" data-theme-toggle aria-label="Toggle dark mode">
      <i data-lucide="sun" class="w-4 h-4 icon-sun" style="display:none;"></i>
      <i data-lucide="moon" class="w-4 h-4 icon-moon"></i>
    </button>
  </div>


  <!-- Background Image & Overlay -->
  <div class="fixed inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1558981285-6f0c94958bb6?w=1600&h=1000&fit=crop" alt="Motorcycle Background" class="w-full h-full object-cover" />
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[3px]"></div>
  </div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md bg-white dark:bg-surface-dark rounded-2xl shadow-2xl overflow-hidden animate-on-scroll border border-white/10">
    <div class="p-6 sm:p-8 md:p-10">
      <!-- Card Header -->
      <div class="mb-8">
        <div class="flex items-center justify-center mb-6">
          <a href="index.html" class="navbar__logo">
            <div class="navbar__logo-icon"><i data-lucide="bike" class="w-5 h-5 sm:w-6 sm:h-6"></i></div>
            <span class="text-xl sm:text-2xl">Ride<span class="text-primary">On</span></span>
          </a>
        </div>
        <div class="text-center">
          <h1 class="font-heading text-2xl md:text-3xl font-600 mb-2" style="color: var(--text-heading);">Sign In</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Welcome back! Please enter your credentials.</p>
        </div>
      </div>

      <!-- Social Login -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <button class="btn btn--ghost text-sm border-slate-200 dark:border-slate-700 px-2" onclick="showToast('Google login coming soon!', 'info')">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        </button>
        <button class="btn btn--ghost text-sm border-slate-200 dark:border-slate-700 px-2" onclick="showToast('Facebook login coming soon!', 'info')">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </button>
        <button class="btn btn--ghost text-sm border-slate-200 dark:border-slate-700 px-2" onclick="showToast('Apple login coming soon!', 'info')">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.96.95-2.04 1.72-3.32 1.72-1.25 0-1.68-.78-3.23-.78-1.56 0-2.05.75-3.24.78-1.25.03-2.31-.76-3.34-1.78C1.82 18.14.24 13.9 2.31 10.1c1.03-1.89 2.97-3.08 5.08-3.11 1.6-.03 3.11 1.08 4.09 1.08.97 0 2.82-1.35 4.75-1.15 1.93.2 3.4 1.15 4.3 2.53-2.18 1.3-1.83 4.29.5 5.5-1.07 2.45-2.6 4.67-3.98 5.33zm-4.75-15.65c.86-1.04 1.44-2.48 1.28-3.92-1.24.05-2.74.83-3.63 1.87-.8.93-1.5 2.4 1.29 3.99.16-1.04.53-1.95 1.06-1.94z"/></svg>
        </button>
      </div>

      <div class="flex items-center gap-3 mb-6"><div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div><span class="text-xs text-slate-400 font-500">OR</span><div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div></div>

      <!-- Login Form -->
      <form data-validate id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="relative"><i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i><input type="email" id="loginEmail" class="form-input pl-10" placeholder="Enter your email" required /></div>
          <p class="form-error">Please enter a valid email</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input type="password" id="loginPassword" class="form-input pl-10" placeholder="Enter your password" required data-minlength="6" />
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="mt-2 text-right">
            <a href="forgot-password.html" class="text-xs text-primary font-600 hover:underline">Forgot Password?</a>
          </div>
          <p class="form-error">Must be at least 6 characters</p>
        </div>
        <div class="flex items-center gap-2 mb-6">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-300 text-primary accent-primary" />
          <label for="rememberMe" class="text-sm text-slate-500 dark:text-slate-400">Remember me for 30 days</label>
        </div>
        <button type="submit" class="btn btn--primary w-full btn--lg mb-4">Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
      </form>
      <p class="text-center text-sm text-slate-500">Don't have an account? <a href="register.html" class="text-primary font-600 hover:underline">Sign up free</a></p>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="assets/js/main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
